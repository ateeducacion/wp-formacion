# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "github-actions" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
  - package-ecosystem: "composer" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm" # @wordpress/env y su lockfile (utillaje de desarrollo)
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    groups:
      # vite, vitest y sus plugins van juntos: un PR por cada uno deja el
      # árbol con versiones que no se esperan entre sí.
      vite:
        patterns:
          - "vite"
          - "vitest"
          - "@vitest/*"
    ignore:
      # Se sirven desde jsDelivr con SRI: su versión está también en la URL, el
      # `integrity` y el `$ver` del encolado, y se suben a mano los tres juntos.
      - dependency-name: "sweetalert2"
      - dependency-name: "tom-select"
